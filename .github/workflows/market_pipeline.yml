name: SPY Market Analytics Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 1-5"

permissions:
  contents: read

concurrency:
  group: spy-market-analytics-pipeline
  cancel-in-progress: false

jobs:
  market-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Ingest market data
        run: python -m src.data_ingestion

      - name: Build features
        run: python -m src.features

      - name: Run exploratory data analysis
        run: python -m src.eda

      - name: Train and evaluate model
        run: python -m src.train_model

      - name: Backtest strategy
        run: python -m src.backtest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spy-market-analytics-reports
          path: reports/
          retention-days: 14
